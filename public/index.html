<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Setters | Coming Soon</title>
  <meta name="description" content="Clinic Setters is coming soon.">
  <meta name="theme-color" content="#f7f1ec">
  <meta property="og:title" content="Clinic Setters">
  <meta property="og:description" content="Something beautiful is on the way.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='32' fill='%23f7f1ec'/><text x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%23b08d6a'>CS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f7f1ec;
      --blush: #ecd9d0;
      --rose: #d9b8ad;
      --ink: #3d3330;
      --muted: #8a7a73;
      --gold: #b08d6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Montserrat", system-ui, sans-serif;
      font-weight: 400;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* soft floating forms */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.75;
    }
    .orb.one {
      width: 520px; height: 520px;
      background: radial-gradient(circle, var(--blush), transparent 70%);
      top: -160px; left: -140px;
      animation: float 20s ease-in-out infinite alternate;
    }
    .orb.two {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #f1e4d6, transparent 70%);
      bottom: -220px; right: -160px;
      animation: float 24s ease-in-out infinite alternate-reverse;
    }
    .orb.three {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(217,184,173,0.55), transparent 70%);
      top: 55%; left: 62%;
      animation: float 16s ease-in-out infinite alternate;
    }
    @keyframes float {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(30px, 24px, 0) scale(1.06); }
    }

    /* fine paper grain */
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.18; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.45 0 0 0 0 0.4 0 0 0 0.35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    header, main, footer { position: relative; z-index: 1; }

    header {
      padding: 36px 24px 0;
      display: flex;
      justify-content: center;
    }
    .monogram {
      width: 64px; height: 64px;
      border: 1px solid rgba(176,141,106,0.55);
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 24px;
      letter-spacing: 0.04em;
      color: var(--gold);
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(4px);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px 56px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
    }

    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 300;
      font-size: clamp(48px, 10vw, 120px);
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .brand em {
      font-style: italic;
      color: var(--gold);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 34px 0 30px;
      color: var(--gold);
    }
    .divider::before, .divider::after {
      content: "";
      width: 56px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .divider::after { transform: scaleX(-1); }
    .divider svg { width: 10px; height: 10px; }

    .coming {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(26px, 4.4vw, 40px);
      color: var(--ink);
    }

    .lede {
      margin-top: 16px;
      max-width: 420px;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    footer {
      padding: 28px 24px 36px;
      text-align: center;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .fade { opacity: 0; transform: translateY(14px); animation: in 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.6s; }
    .d4 { animation-delay: 0.85s; }
    .d5 { animation-delay: 1.1s; }
    @keyframes in { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .orb, .fade { animation: none; }
      .fade { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="grain"></div>

  <header>
    <div class="monogram fade d1">CS</div>
  </header>

  <main>
    <p class="eyebrow fade d1">Aesthetics &amp; Beauty</p>
    <h1 class="brand fade d2">Clinic <em>Setters</em></h1>
    <div class="divider fade d3" aria-hidden="true">
      <svg viewBox="0 0 10 10"><path d="M5 0 L6 4 L10 5 L6 6 L5 10 L4 6 L0 5 L4 4 Z" fill="currentColor"/></svg>
    </div>
    <p class="coming fade d4">Coming soon</p>
    <p class="lede fade d5">Something beautiful is on the way. We can't wait to share it with you.</p>
  </main>

  <footer>&copy; <span id="y"></span> Clinic Setters</footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>

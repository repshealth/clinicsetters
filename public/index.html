<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Setters | Coming Soon</title>
  <meta name="description" content="Clinic Setters is coming soon.">
  <meta name="theme-color" content="#0b0f14">
  <meta property="og:title" content="Clinic Setters">
  <meta property="og:description" content="Something new is on the way.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0f14'/><path d='M32 16v32M16 32h32' stroke='%2350e3c2' stroke-width='8' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --fg: #f3f6f8;
      --muted: #8b97a3;
      --accent: #50e3c2;
      --accent-2: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Montserrat", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 400px at 20% 20%, rgba(80, 227, 194, 0.14), transparent 70%),
        radial-gradient(700px 500px at 85% 80%, rgba(59, 130, 246, 0.14), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to   { transform: translate3d(2%, 1%, 0) scale(1.05); }
    }
    header, main, footer { position: relative; z-index: 1; }
    header {
      padding: 28px 24px;
      display: flex;
      justify-content: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 15px;
    }
    .logo-mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
    }
    .logo-mark svg { width: 14px; height: 14px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 48px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
      margin-bottom: 28px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(80,227,194,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(80,227,194,0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(80,227,194,0); }
      100% { box-shadow: 0 0 0 0 rgba(80,227,194,0); }
    }
    h1 {
      font-weight: 800;
      font-size: clamp(44px, 10vw, 112px);
      line-height: 0.95;
      letter-spacing: -0.035em;
    }
    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.lede {
      margin-top: 24px;
      max-width: 460px;
      font-size: clamp(15px, 2.2vw, 18px);
      line-height: 1.6;
      color: var(--muted);
    }
    footer {
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .fade { opacity: 0; transform: translateY(12px); animation: in 0.9s ease forwards; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.35s; }
    @keyframes in { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .dot, .fade { animation: none; }
      .fade { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <header>
    <div class="logo fade d1">
      <div class="logo-mark">
        <svg viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="#0b0f14" stroke-width="2.6" stroke-linecap="round"/></svg>
      </div>
      Clinic Setters
    </div>
  </header>

  <main>
    <div class="pill fade d1"><span class="dot"></span>Launching soon</div>
    <h1 class="fade d2">Coming<br><span>soon.</span></h1>
    <p class="lede fade d3">Something new is on the way. Check back shortly.</p>
  </main>

  <footer>&copy; <span id="y"></span> Clinic Setters. All rights reserved.</footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
